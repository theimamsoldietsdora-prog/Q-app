<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق Q</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-xl mx-auto min-h-screen bg-white shadow-md flex flex-col">
        <!-- الشريط العلوي -->
        <header class="bg-blue-500 text-white p-4 text-center text-xl font-bold flex justify-between items-center px-6">
            <span>منصة Q 🚀</span>
            <span class="text-sm bg-blue-600 px-3 py-1 rounded-full">نسخة تجريبية</span>
        </header>

        <!-- صندوق النشر -->
        <div class="p-4 border-b border-gray-200 bg-gray-50">
            <textarea id="postInput" placeholder="ماذا يدور في ذهنك يا Q؟" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none h-24 text-gray-800"></textarea>
            <div class="flex justify-end mt-2">
                <button onclick="addPost()" class="bg-blue-500 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-600 transition shadow">
                    نشر
                </button>
            </div>
        </div>

        <!-- قائمة المنشورات -->
        <div id="timeline" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- المنشورات ستظهر هنا -->
        </div>
    </div>

    <script>
        function addPost() {
            const input = document.getElementById('postInput');
            const text = input.value.trim();

            if (text === "") {
                alert("يرجى كتابة نص المنشور أولاً!");
                return;
            }

            const timeline = document.getElementById('timeline');
            const postDiv = document.createElement('div');
            postDiv.className = "bg-white border border-gray-200 rounded-xl p-4 shadow-sm space-y-2";
            
            postDiv.innerHTML = `
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-10 h-10 bg-blue-500 text-white rounded-full flex items-center justify-center font-bold text-lg shadow">Q</div>
                    <div>
                        <h4 class="font-bold text-gray-800">Q Hameed</h4>
                        <span class="text-xs text-gray-400">الآن</span>
                    </div>
                </div>
                <p class="text-gray-700 text-base leading-relaxed">${escapeHtml(text)}</p>
                <div class="flex items-center space-x-4 space-x-reverse pt-2 border-t border-gray-100 mt-2">
                    <button onclick="likePost(this)" class="text-gray-500 hover:text-red-500 text-sm flex items-center space-x-1 space-x-reverse transition">
                        ❤️ <span class="like-count">0</span> إعجاب
                    </button>
                </div>
            `;

            timeline.prepend(postDiv);
            input.value = "";
        }

        function likePost(button) {
            const span = button.querySelector('.like-count');
            let count = parseInt(span.innerText);
            span.innerText = count + 1;
            button.classList.add('text-red-500');
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
